<!DOCTYPE html>
<html lang="pt">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Escalas de emergência pré-hospitalar.">
  <meta name="theme-color" content="#2C496C">

  <!-- Installable on iOS via "Adicionar ao ecrã principal". -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EPHScores">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>EPHScores</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F3F4F9; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, -apple-system, Roboto, sans-serif; color: #2C496C;
    }
    #splash img { width: 112px; height: 112px; }
    #splash span { font-size: 15px; opacity: .7; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #111318; }
      #splash { color: #D6E3FF; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <span>A carregar…</span>
  </div>
  <script>
    // Offline support: sw.js is generated by scripts/build_web.sh.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
