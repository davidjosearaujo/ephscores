<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>EPHScores</title>
  <!--
    Single source of the app's logo. Everything else is derived from this file:
    the launcher/web icons (scripts/icons/make_icons.mjs) and the in-app logo
    (lib/ui/brand.dart). Colours are looked up by value, so change them in the
    code too (Palette in lib/theme.dart): navy badge, white lower arms, and the
    three top arms green, amber, red like the score colours in the app.

    The star is the Star of Life (three bars rotated 60 degrees apart), drawn
    as coloured wedges trimmed to the star's outline: one wedge for each of the
    three top arms, and one white half for the three lower arms, so adjacent
    areas never overlap and same-colour arms leave no antialiasing seams.
  -->
  <defs>
    <clipPath id="star-shape">
      <rect x="197" y="36" width="118" height="440" rx="14"/>
      <rect x="197" y="36" width="118" height="440" rx="14" transform="rotate(60 256 256)"/>
      <rect x="197" y="36" width="118" height="440" rx="14" transform="rotate(120 256 256)"/>
    </clipPath>
  </defs>
  <polygon id="badge" points="256.0,34.0 448.3,145.0 448.3,367.0 256.0,478.0 63.7,367.0 63.7,145.0" fill="#2C496C" stroke="#2C496C" stroke-width="40" stroke-linejoin="round"/>
  <g id="star" transform="translate(256 256) scale(0.76) translate(-256 -256)">
    <g clip-path="url(#star-shape)">
      <polygon id="arm-upper-left" points="256.0,256.0 -144.0,256.0 56.0,-90.4" fill="#34A853"/>
      <polygon id="arm-top" points="256.0,256.0 56.0,-90.4 456.0,-90.4" fill="#FBBC04"/>
      <polygon id="arm-upper-right" points="256.0,256.0 456.0,-90.4 656.0,256.0" fill="#EA4335"/>
      <polygon id="arms-lower" points="-144,256 656,256 656,656 -144,656" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
