name: ephscores
description: "Escalas de emergência pré-hospitalar. Funciona totalmente offline."
publish_to: 'none'

version: 2.0.0+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/Contacts.json
    - assets/EPHScores_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
