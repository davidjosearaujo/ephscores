name: ephscores
description: "Escalas de emergência pré-hospitalar. Funciona totalmente offline."
publish_to: 'none'

version: 2.0.0+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/Contacts.json
    - assets/EPHScores_logo.png
    - assets/fonts/OFL.txt

  # Bundled so the web build never fetches fonts from the network.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
