name: ephscores
description: "Escalas de emergência pré-hospitalar."
publish_to: 'none'

# Single source of the app's identity. The version flows into every
# platform build; the info dialog reads this file at runtime (it is
# bundled as an asset), and test/manifest_test.dart checks that the
# Android, iOS and web manifests agree with app_info below.
version: 2.0.0+10
homepage: https://ephscores-7e4eb.web.app
repository: https://codeberg.org/davidjosearaujo/ephscores

app_info:
  display_name: EPHScores
  application_id: com.davidaraujo.ephscores
  developer: David Araújo
  developer_url: https://www.davidjosearaujo.dev

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.0
  web: ^1.1.0
  yaml: ^3.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/Contacts.json
    - assets/brand/logo.svg
    - assets/fonts/OFL.txt
    - pubspec.yaml

  # Bundled so the web build never fetches fonts from the network.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
